<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="DM Sans, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B0817"/>
      <stop offset="55%" stop-color="#08060F"/>
      <stop offset="100%" stop-color="#0E0B1C"/>
    </linearGradient>
    <radialGradient id="glow" cx="78%" cy="32%" r="55%">
      <stop offset="0%" stop-color="#6B5AE0" stop-opacity="0.45"/>
      <stop offset="60%" stop-color="#6B5AE0" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#6B5AE0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6B5AE0"/>
      <stop offset="100%" stop-color="#A695F5"/>
    </linearGradient>
    <linearGradient id="em" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#A695F5"/>
      <stop offset="100%" stop-color="#6B5AE0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <rect x="6" y="6" width="1188" height="618" rx="22" fill="none" stroke="#A695F5" stroke-opacity="0.14" stroke-width="2"/>

  <!-- Decorative rings -->
  <circle cx="980" cy="200" r="230" fill="none" stroke="#A695F5" stroke-opacity="0.10" stroke-width="1.5"/>
  <circle cx="980" cy="200" r="320" fill="none" stroke="#6B5AE0" stroke-opacity="0.07" stroke-width="1.5"/>

  <!-- Eyebrow -->
  <g transform="translate(90,150)">
    <rect x="0" y="-9" width="34" height="2.5" rx="1.25" fill="url(#accent)"/>
    <text x="48" y="0" fill="#A695F5" font-size="20" font-weight="600" letter-spacing="5" dominant-baseline="middle">MEMORY CARE TECHNOLOGY</text>
  </g>

  <!-- Wordmark -->
  <text x="88" y="270" fill="#FAF8F4" font-size="92" font-weight="600" letter-spacing="-1">Vela Vision</text>

  <!-- Headline -->
  <text x="90" y="372" fill="#FAF8F4" font-size="58" font-weight="500">Faces remembered.</text>
  <text x="90" y="442" fill="#FAF8F4" font-size="58" font-weight="500">Connections <tspan fill="url(#em)" font-style="italic" font-family="Cormorant Garamond, Georgia, serif">preserved.</tspan></text>

  <!-- Subline -->
  <text x="92" y="520" fill="#8B7FA8" font-size="26" font-weight="400">Smart glasses that help dementia patients recognize</text>
  <text x="92" y="556" fill="#8B7FA8" font-size="26" font-weight="400">the people they love — names, relationships, warm context.</text>

  <!-- URL pill -->
  <g transform="translate(90,584)">
    <circle cx="6" cy="0" r="5" fill="#A695F5"/>
    <text x="22" y="0" fill="#A695F5" font-size="22" font-weight="500" letter-spacing="1" dominant-baseline="middle">velavision.org</text>
  </g>
</svg>
